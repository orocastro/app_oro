    <script src="<?php echo $base_url; ?>frontend/assets/js/scripts.js?v=20261002b"></script>
    <script>
        const form = document.getElementById('material-form');
        const tableBody = document.getElementById('materiales-table-body');
        const cardsContainer = document.getElementById('materiales-cards');
        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const materialIdInput = document.getElementById('material-id');
        const materialNombreInput = document.getElementById('material-nombre');
        const materialProtegidoInput = document.getElementById('material-protegido');
        const loadingMessage = document.getElementById('loading-message');
        const API_ENDPOINT = 'materiales';

        let dataAll = [];
        let filtered = [];
        let page = 1;
        const pageSize = 10;

        async function fetchMateriales() {
            loadingMessage.classList.remove('hidden');
            const result = await callApi(API_ENDPOINT, 'GET');
            tableBody.innerHTML = '';
            dataAll = [];
            loadingMessage.classList.add('hidden');

            if (result.success && Array.isArray(result.data)) {
                dataAll = result.data;
                filtered = dataAll;
                page = 1;
                renderPage();
            } else if (result.success) {
                tableBody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-gray-500">No hay materiales registrados.</td></tr>';
                cardsContainer.innerHTML = '<p class="text-center py-4 text-gray-500">No hay materiales registrados.</p>';
            } else {
                showMessageModal('Error', result.message || 'Error al cargar materiales.', 'error');
            }
        }

        function createRow(item) {
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-gray-100 transition duration-150';
            const inUse = String(item.in_use) === '1' || item.in_use === 1 || item.in_use === true;
            const protegido = String(item.protegido) === '1' || item.protegido === 1 || item.protegido === true;
            tr.innerHTML = `
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${item.id}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-800">${item.nombre}</td>
                <td class="px-6 py-4 whitespace-nowrap text-center text-sm ${protegido ? 'text-teal-700' : 'text-gray-500'}">${protegido ? 'Sí' : 'No'}</td>
                <td class="px-6 py-4 whitespace-nowrap text-center text-sm font-medium">
                    <button data-id="${item.id}" class="edit-btn text-teal-600 hover:text-teal-900 mr-3">Editar</button>
                    ${protegido || inUse
                        ? '<span class="text-gray-400 italic">No elim.</span>'
                        : `<button data-id="${item.id}" data-nombre="${item.nombre}" class="delete-btn text-red-600 hover:text-red-900">Eliminar</button>`}
                </td>`;
            return tr;
        }

        // Crea una tarjeta móvil para un material
        function createCard(item) {
            const card = document.createElement('div');
            card.className = 'mobile-card';
            const inUse = String(item.in_use) === '1' || item.in_use === 1 || item.in_use === true;
            const protegido = String(item.protegido) === '1' || item.protegido === 1 || item.protegido === true;
            card.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <span class="font-semibold text-gray-900 text-lg">${item.nombre}</span>
                    <span class="text-xs text-gray-400">ID ${item.id}</span>
                </div>
                <div class="text-sm mb-2">
                    <span class="text-gray-500">Protegido:</span>
                    <span class="${protegido ? 'text-teal-700 font-medium' : 'text-gray-500'}">${protegido ? 'Sí' : 'No'}</span>
                </div>
                <div class="flex flex-wrap gap-3 text-sm">
                    <button data-id="${item.id}" class="edit-btn text-teal-600 hover:text-teal-900">Editar</button>
                    ${protegido || inUse
                        ? '<span class="text-gray-400 italic">No elim.</span>'
                        : `<button data-id="${item.id}" data-nombre="${item.nombre}" class="delete-btn text-red-600 hover:text-red-900">Eliminar</button>`}
                </div>
            `;
            return card;
        }

        function renderPage() {
            tableBody.innerHTML = '';
            cardsContainer.innerHTML = '';
            const total = filtered.length;
            if (total === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-gray-500">No hay materiales registrados.</td></tr>';
                cardsContainer.innerHTML = '<p class="text-center py-4 text-gray-500">No hay materiales registrados.</p>';
                document.getElementById('pager').style.display = 'none';
                return;
            }
            const totalPages = Math.max(1, Math.ceil(total / pageSize));
            page = Math.min(page, totalPages);
            const start = (page - 1) * pageSize;
            const slice = filtered.slice(start, start + pageSize);
            slice.forEach(it => {
                tableBody.appendChild(createRow(it));
                cardsContainer.appendChild(createCard(it));
            });
            const pager = document.getElementById('pager');
            const pageInfo = document.getElementById('page-info');
            const prevBtn = document.getElementById('prev-page');
            const nextBtn = document.getElementById('next-page');
            pager.style.display = total > pageSize ? 'flex' : 'none';
            pageInfo.textContent = `Página ${page} de ${totalPages}`;
            prevBtn.disabled = page <= 1;
            nextBtn.disabled = page >= totalPages;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = materialIdInput.value;
            const nombre = materialNombreInput.value.trim();
            const protegido = materialProtegidoInput.checked ? 1 : 0;
            const isEditing = id !== '';
            const method = isEditing ? 'PUT' : 'POST';
            const payload = isEditing ? { id, nombre, protegido } : { nombre, protegido };
            const result = await callApi(API_ENDPOINT, method, payload);
            if (result.success) {
                showMessageModal('Éxito', `Material ${nombre} ${isEditing ? 'actualizado' : 'creado'} exitosamente.`, 'success');
                resetFormState();
                fetchMateriales();
            } else {
                showMessageModal('Error', result.message || 'No se pudo guardar el material.', 'error');
            }
        });

        function handleListClick(e) {
            if (e.target.classList.contains('edit-btn')) {
                const id = e.target.dataset.id;
                const mat = dataAll.find(r => r.id == id);
                if (mat) {
                    materialIdInput.value = mat.id;
                    materialNombreInput.value = mat.nombre;
                    materialProtegidoInput.checked = String(mat.protegido) === '1' || mat.protegido === 1 || mat.protegido === true;
                    formTitle.textContent = 'Editar Material ID: ' + mat.id;
                    submitBtn.textContent = 'GUARDAR CAMBIOS';
                    cancelBtn.classList.remove('hidden');
                }
            } else if (e.target.classList.contains('delete-btn')) {
                handleDelete(e.target.dataset.id, e.target.dataset.nombre);
            }
        }
        // La misma delegación aplica a la tabla (desktop) y a las tarjetas (móvil)
        tableBody.addEventListener('click', handleListClick);
        cardsContainer.addEventListener('click', handleListClick);

        async function handleDelete(id, nombre) {
            if (!await confirmModal('Eliminar Material', `¿Eliminar material "${nombre}" (ID: ${id})?`, { danger: true })) return;
            const result = await callApi(API_ENDPOINT, 'DELETE', { id });
            if (result.success) {
                showMessageModal('Éxito', `Material ${nombre} eliminado.`, 'success');
                fetchMateriales();
            } else {
                showMessageModal('Error', result.message || 'No se pudo eliminar el material.', 'error');
            }
        }

        function resetFormState() {
            materialIdInput.value = '';
            materialNombreInput.value = '';
            materialProtegidoInput.checked = false;
            formTitle.textContent = 'Crear Nuevo Material';
            submitBtn.textContent = 'REGISTRAR';
            cancelBtn.classList.add('hidden');
        }

        cancelBtn.addEventListener('click', resetFormState);

        window.onload = () => {
            fetchMateriales();
            const prevBtn = document.getElementById('prev-page');
            const nextBtn = document.getElementById('next-page');
            prevBtn.addEventListener('click', () => { if (page > 1) { page--; renderPage(); }});
            nextBtn.addEventListener('click', () => { const totalPages = Math.max(1, Math.ceil((filtered.length||0)/pageSize)); if (page < totalPages) { page++; renderPage(); }});
            const filtro = document.getElementById('filtro');
            filtro.addEventListener('input', () => {
                const q = filtro.value.toLowerCase();
                filtered = dataAll.filter(r => (r.nombre||'').toLowerCase().includes(q));
                page = 1; renderPage();
            });

            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', async function(e) {
                    e.preventDefault();
                    const result = await callApi('logout', 'GET');
                    if (result.success) {
                        const base = (typeof window !== 'undefined' && window.BASE_URL) ? window.BASE_URL : '/';
                        window.location.href = base;
                    } else {
                        showMessageModal('Error', 'No se pudo cerrar sesión.', 'error');
                    }
                });
            }
        };
    </script>
</body>
