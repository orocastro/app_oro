    <!-- Incluimos el script principal -->
    <script src="<?php echo $base_url; ?>frontend/assets/js/scripts.js"></script>
    <script>
        // Lógica de la vista CRUD Productos

        const form = document.getElementById('producto-form');
        const tableBody = document.getElementById('productos-table-body');
        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const productoIdInput = document.getElementById('producto-id');
        const productoNombreInput = document.getElementById('producto-nombre');
        const loadingMessage = document.getElementById('loading-message');

        const API_ENDPOINT = 'productos';
    let productosData = []; // Para almacenar los datos locales
    let filtered = [];
    let page = 1;
    const pageSize = 10;

        // --- Funciones del CRUD ---

        // 1. Obtener y Renderizar Productos (READ)
        async function fetchProductos() {
            loadingMessage.classList.remove('hidden');
            const result = await callApi(API_ENDPOINT, 'GET');

            tableBody.innerHTML = ''; // Limpiar la tabla
            productosData = [];
            loadingMessage.classList.add('hidden');

            if (result.success && result.data.length > 0) {
                productosData = result.data;
                filtered = productosData;
                page = 1;
                renderPage();
            } else if (result.success && result.data.length === 0) {
                 tableBody.innerHTML = '<tr><td colspan="3" class="text-center py-4 text-gray-500">No hay productos registrados.</td></tr>';
            } else {
                 showMessageModal('Error de Carga', result.message || 'Error desconocido al cargar productos.', 'error');
            }
        }

        // Crea una fila HTML para un producto
        function createTableRow(producto) {
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-gray-100 transition duration-150';
            const disabled = String(producto.in_use) === '1' || producto.in_use === 1 || producto.in_use === true;
            tr.innerHTML = `
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${producto.id}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-800">${producto.nombre}</td>
                <td class="px-6 py-4 whitespace-nowrap text-center text-sm font-medium">
                    ${disabled
                        ? '<span class="text-gray-400 italic">Protegido</span>'
                        : `<button data-id="${producto.id}" class="edit-btn text-teal-600 hover:text-teal-900 mr-3">Editar</button>
                           <button data-id="${producto.id}" data-nombre="${producto.nombre}" class="delete-btn text-red-600 hover:text-red-900">Eliminar</button>`}
                </td>
            `;
            return tr;
        }

        function renderPage() {
            tableBody.innerHTML = '';
            const total = filtered.length;
            if (total === 0) {
                tableBody.innerHTML = '<tr><td colspan="3" class="text-center py-4 text-gray-500">No hay productos registrados.</td></tr>';
                document.getElementById('pager').style.display = 'none';
                return;
            }
            const totalPages = Math.max(1, Math.ceil(total / pageSize));
            page = Math.min(page, totalPages);
            const start = (page - 1) * pageSize;
            const slice = filtered.slice(start, start + pageSize);
            slice.forEach(p => tableBody.appendChild(createTableRow(p)));
            const pager = document.getElementById('pager');
            const pageInfo = document.getElementById('page-info');
            const prevBtn = document.getElementById('prev-page');
            const nextBtn = document.getElementById('next-page');
            pager.style.display = total > pageSize ? 'flex' : 'none';
            pageInfo.textContent = `Página ${page} de ${totalPages}`;
            prevBtn.disabled = page <= 1;
            nextBtn.disabled = page >= totalPages;
        }

        // 2. Crear/Actualizar Producto (CREATE/UPDATE)
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const id = productoIdInput.value;
            const nombre = productoNombreInput.value.trim();
            const isEditing = id !== '';
            
            const method = isEditing ? 'PUT' : 'POST';
            const messageAction = isEditing ? 'actualizado' : 'creado';
            
            const data = { nombre };
            if (isEditing) {
                data.id = id;
            }

            const result = await callApi(API_ENDPOINT, method, data);

            if (result.success) {
                showMessageModal('Éxito', `Producto ${nombre} ${messageAction} exitosamente.`, 'success');
                form.reset();
                resetFormState();
                fetchProductos(); // Recargar la lista
            } else {
                showMessageModal('Error', result.message || `No se pudo ${isEditing ? 'actualizar' : 'crear'} el producto.`, 'error');
            }
        });

        // 3. Cargar datos para Edición (UPDATE PREP)
        tableBody.addEventListener('click', function(e) {
            if (e.target.classList.contains('edit-btn')) {
                const id = e.target.dataset.id;
                const producto = productosData.find(r => r.id == id);
                
                if (producto) {
                    productoIdInput.value = producto.id;
                    productoNombreInput.value = producto.nombre;
                    
                    // Cambiar estado del formulario a Edición
                    formTitle.textContent = 'Editar Producto ID: ' + producto.id;
                    submitBtn.textContent = 'GUARDAR CAMBIOS';
                    cancelBtn.classList.remove('hidden');
                }
            } else if (e.target.classList.contains('delete-btn')) {
                handleDelete(e.target.dataset.id, e.target.dataset.nombre);
            }
        });
        
        // Función para resetear el estado del formulario de edición/creación
        function resetFormState() {
            productoIdInput.value = '';
            formTitle.textContent = 'Crear Nuevo Producto';
            submitBtn.textContent = 'REGISTRAR';
            cancelBtn.classList.add('hidden');
            form.reset();
        }

        cancelBtn.addEventListener('click', resetFormState);


        // 4. Eliminar Producto (DELETE)
        async function handleDelete(id, nombre) {
            if (!confirm(`¿Está seguro de eliminar el producto "${nombre}" (ID: ${id})?`)) {
                return;
            }
            
            const result = await callApi(API_ENDPOINT, 'DELETE', { id: id }); 

            if (result.success) {
                showMessageModal('Éxito', `Producto ${nombre} eliminado exitosamente.`, 'success');
                fetchProductos(); // Recargar la lista
            } else {
                showMessageModal('Error', result.message || `No se pudo eliminar el producto.`, 'error');
            }
        }

        // --- Inicialización ---
        window.onload = () => {
            fetchProductos();
            const prevBtn = document.getElementById('prev-page');
            const nextBtn = document.getElementById('next-page');
            prevBtn.addEventListener('click', () => { if (page > 1) { page--; renderPage(); }});
            nextBtn.addEventListener('click', () => { const totalPages = Math.max(1, Math.ceil((productosData.length||0)/pageSize)); if (page < totalPages) { page++; renderPage(); }});
            const filtro = document.getElementById('filtro');
            filtro.addEventListener('input', () => {
                const q = filtro.value.toLowerCase();
                filtered = productosData.filter(r => (r.nombre||'').toLowerCase().includes(q));
                page = 1;
                renderPage();
            });

            // Logout
            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', async function(e) {
                    e.preventDefault();
                    const result = await callApi('logout', 'GET');
                    if (result.success) {
                        const base = (typeof window !== 'undefined' && window.BASE_URL) ? window.BASE_URL : '/';
                        window.location.href = base;
                    } else {
                        showMessageModal('Error', 'No se pudo cerrar sesión.', 'error');
                    }
                });
            }
        };
    </script>
</body>
