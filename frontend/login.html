    <script>
        const loginView = document.getElementById('login-view');
        const recoverView = document.getElementById('recover-view');
        const recoverLink = document.getElementById('recover-link');
        const loginLink = document.getElementById('login-link');
        const loginForm = document.getElementById('login-form');
        const recoverForm = document.getElementById('recover-form');

        // Función para cambiar de vista (Login <-> Recuperación)
        function toggleViews(showLogin) {
            if (showLogin) {
                loginView.classList.remove('hidden');
                recoverView.classList.add('hidden');
            } else {
                loginView.classList.add('hidden');
                recoverView.classList.remove('hidden');
            }
        }

        recoverLink.addEventListener('click', function(e) {
            e.preventDefault();
            toggleViews(false);
        });

        loginLink.addEventListener('click', function(e) {
            e.preventDefault();
            toggleViews(true);
        });

        // 1. Lógica de Login (POST /api/login)
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const originalText = btn.textContent;
            btn.textContent = 'Ingresando...';
            btn.disabled = true;

            const usuario = document.getElementById('usuario').value;
            const clave = document.getElementById('clave').value;
            
            const result = await callApi('login', 'POST', { usuario, clave });

            if (result.success) {
                showMessageModal('¡Bienvenido!', `Hola ${result.user.nombre}. Acceso concedido.`, 'success');
                // Redirigir a la vista principal respetando la BASE_URL
                const base = (typeof window !== 'undefined' && window.BASE_URL) ? window.BASE_URL : '/';
                window.location.href = base + 'home';
            } else {
                showMessageModal('Error de Acceso', result.message || 'Error desconocido al iniciar sesión.', 'error');
            }
            
            btn.textContent = originalText;
            btn.disabled = false;
        });

        // 2. Lógica de Recuperación (POST /api/recover)
        recoverForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const usuario = document.getElementById('recover-usuario').value;
            
            const result = await callApi('recover', 'POST', { usuario });

            if (result.success) {
                showMessageModal('Instrucciones Enviadas', result.message, 'success');
                // Volver al login tras enviar la petición
                toggleViews(true);
                recoverForm.reset();
            } else {
                showMessageModal('Error', result.message || 'Error desconocido al solicitar recuperación.', 'error');
            }
        });
    </script>
