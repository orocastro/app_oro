        // --- FUNCIONES DE UTILIDAD ---
        async function loadDropdown(endpoint, selectId, placeholder = "Seleccionar...") {
            const select = document.getElementById(selectId);
            select.innerHTML = `<option value="">Cargando ${endpoint}...</option>`;
            const result = await callApi(endpoint, 'GET');
            select.innerHTML = `<option value="">${placeholder}</option>`;
            select.disabled = false;
            if (result.success && result.data) {
                result.data.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.id;
                    option.textContent = item.nombre;
                    select.appendChild(option);
                });
            } else {
                select.innerHTML = `<option value="">Error al cargar ${endpoint}</option>`;
                select.disabled = true;
                showMessageModal('Error de Carga', `No se pudieron cargar los datos de ${endpoint}.`, 'error');
            }
        }

        // Cargar materiales
        async function loadMateriales() {
            const r = await callApi('materiales', 'GET');
            if (r.success && Array.isArray(r.data)) {
                materialesCatalog = r.data;
            } else {
                materialesCatalog = [];
            }
        }

        function setMaterialesStateFromDB(modo, items) {
            const isEntrega = modo === 'entrega';
            const weightsMap = isEntrega ? matWeightsEntrega : matWeightsRecibido;
            const existingMap = isEntrega ? matExistingFotosEntrega : matExistingFotosRecibido;
            // Resetear estado
            Object.keys(weightsMap).forEach(k => { delete weightsMap[k]; });
            Object.keys(existingMap).forEach(k => { delete existingMap[k]; });

            if (Array.isArray(items)) {
                items.forEach(it => {
                    const id = it.material_id;
                    if (!id) return;
                    const num = Number(it.peso || 0);
                    weightsMap[id] = Number.isFinite(num) ? num : 0;
                    existingMap[id] = Array.isArray(it.fotos) ? it.fotos : [];
                });
            }
        }

        function updateAndPreviewImages(input) {
            const isEntrega = (input.id === 'foto_entrega');
            const fileStore = isEntrega ? fileStoreEntrega : fileStoreRecibido;
            const container = isEntrega ? previewContainerEntrega : previewContainerRecibido;
            const countEl = isEntrega ? fileCountEntrega : fileCountRecibido;

            if (input.files && input.files.length > 0) {
                Array.from(input.files).forEach(file => fileStore.push(file));
            }

            container.innerHTML = '';
            fileStore.forEach((file, index) => {
                const previewWrapper = document.createElement('div');
                previewWrapper.className = 'relative';
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.className = 'w-full h-24 object-cover rounded-lg shadow-md';
                img.onload = () => URL.revokeObjectURL(img.src);
                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.innerHTML = '&times;';
                removeBtn.className = 'absolute top-0 right-0 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold';
                removeBtn.title = 'Quitar foto';
                removeBtn.onclick = (e) => {
                    e.stopPropagation();
                    fileStore.splice(index, 1);
                    updateAndPreviewImages(input);
                };
                previewWrapper.appendChild(img);
                previewWrapper.appendChild(removeBtn);
                container.appendChild(previewWrapper);
            });

            countEl.textContent = `${fileStore.length} foto(s) seleccionada(s)`;
            input.value = '';
        }

        function getCurrentDateTime() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            return {
                display: `${dateStr} ${timeStr}`,
                iso: now.getFullYear() + '-' +
                    String(now.getMonth() + 1).padStart(2, '0') + '-' +
                    String(now.getDate()).padStart(2, '0') + ' ' +
                    String(now.getHours()).padStart(2, '0') + ':' +
                    String(now.getMinutes()).padStart(2, '0') + ':' +
                    String(now.getSeconds()).padStart(2, '0')
            };
        }

        async function loadNextConsecutivo() {
            const result = await callApi(`${API_TRAZABILIDAD}/consecutivo`, 'GET');
            if (result.success) {
                consecutivoDisplay.textContent = result.consecutivo_display;
                consecutivoInput.value = result.consecutivo;
            } else {
                consecutivoDisplay.textContent = 'ERROR';
                consecutivoInput.value = '';
                showMessageModal('Error', 'No se pudo obtener el siguiente consecutivo.', 'error');
            }
        }

        function setFormMode(mode) {
            const isEntrega = mode === 'entrega';
            radioEntregaCustom.querySelector('svg').classList.toggle('hidden', !isEntrega);
            radioRecibidoCustom.querySelector('svg').classList.toggle('hidden', isEntrega);
            form.reset();
            radioEntrega.checked = isEntrega;
            radioRecibido.checked = !isEntrega;
            trazabilidadInfo.classList.add('hidden');
            entregaDataRecibido.classList.add('hidden');
            registroIdRecibidoInput.value = '';
            pesoEntregadoOriginalInput.value = '';
            procesoIdRecibidoHidden.value = '';

            if (isEntrega) {
                loadNextConsecutivo();
                consecutivoDisplay.classList.add('bg-gray-100', 'cursor-default');
                submitButton.disabled = false;
            } else {
                consecutivoDisplay.textContent = '0000';
                consecutivoInput.value = '';
                consecutivoDisplay.classList.remove('bg-gray-100', 'cursor-default');
                submitButton.disabled = true;
            }

            fechaLabel.textContent = isEntrega ? 'FECHA DE ENTREGA:' : 'FECHA DE RECIBIDO:';
            pesoLabel.textContent = isEntrega ? 'PESO ENTREGADO Gr:' : 'PESO RECIBIDO Gr:';
            submitButton.textContent = isEntrega ? 'REGISTRAR ENTREGA' : 'REGISTRAR RECIBIDO';
            const now = getCurrentDateTime();
            fechaInput.value = now.display;
            fechaHiddenInput.value = now.iso;
            fotoEntregaContainer.classList.toggle('hidden', !isEntrega);
            fotoRecibidoContainer.classList.toggle('hidden', isEntrega);
            mermaContainer.classList.add('hidden');
            buscarConsecutivoContainer.classList.toggle('hidden', isEntrega);
            document.getElementById('fecha-container').hidden = !isEntrega;

            // Lógica de campos de catálogo
            camposCatalogoEntrega.forEach(field => field.classList.toggle('hidden', !isEntrega));
            camposCatalogoRecibido.forEach(field => field.classList.toggle('hidden', isEntrega));
            [procesoSelect, responsableSelect, productoSelect].forEach(sel => {
                sel.disabled = !isEntrega;
                sel.required = isEntrega;
            });

            // Lógica de campos de peso y búsqueda
            pesoGrInput.required = true;
            document.getElementById('buscar_consecutivo').required = !isEntrega;

            // Limpiar almacenes de archivos y previsualizaciones
            fileStoreEntrega = [];
            fileStoreRecibido = [];
            updateAndPreviewImages(inputFotoEntrega);
            updateAndPreviewImages(inputFotoRecibido);

            // Reiniciar estructuras de materiales sólo al cambiar de modo
            renderMaterialesUI(isEntrega ? 'entrega' : 'recibido');
            // Actualizar bloqueo del peso según materiales actuales
            updatePesoHintAndReadonly(hasAnyMaterialWeight());

            // Asegurar que el campo de peso esté editable y vacío en modo 'Recibido'
            if (!isEntrega) {
                // Se habilita manualmente sólo si no hay materiales
                pesoGrInput.value = '';
                updatePesoHintAndReadonly(hasAnyMaterialWeight());
            } else {
                updatePesoHintAndReadonly(hasAnyMaterialWeight());
            }
        }

        // Construye la UI de materiales según el modo
        function renderMaterialesUI(modo) {
            const isEntrega = modo === 'entrega';
            let container = document.getElementById('materiales-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'materiales-container';
                container.className = 'mt-4 p-4 border border-gray-300 rounded-lg bg-gray-50';
                const anchor = document.getElementById('observaciones').parentElement; // antes de observaciones
                anchor.parentElement.insertBefore(container, anchor);
            }
            container.innerHTML = '';
            const title = document.createElement('h3');
            title.className = 'text-lg font-semibold mb-3 text-gray-700';
            title.textContent = isEntrega ? 'Materiales (Entrega)' : 'Materiales (Recibido)';
            container.appendChild(title);

            if (!materialesCatalog || materialesCatalog.length === 0) {
                const p = document.createElement('p');
                p.className = 'text-sm text-gray-500';
                p.textContent = 'No hay materiales registrados.';
                container.appendChild(p);
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'grid grid-cols-1 sm:grid-cols-2 gap-4';

            const inputsMap = isEntrega ? matInputsEntrega : matInputsRecibido;
            Object.keys(inputsMap).forEach(k => { delete inputsMap[k]; });
            const weightsMap = isEntrega ? matWeightsEntrega : matWeightsRecibido;
            const existingFotosMap = isEntrega ? matExistingFotosEntrega : matExistingFotosRecibido;

            materialesCatalog.forEach(mat => {
                const matId = mat.id;
                const card = document.createElement('div');
                card.className = 'p-3 bg-white rounded border border-gray-200';
                const label = document.createElement('label');
                label.className = 'block text-gray-700 font-medium';
                label.textContent = mat.nombre;
                const input = document.createElement('input');
                input.type = 'text';
                input.inputMode = 'decimal';
                input.placeholder = 'Peso (gr)';
                input.className = 'w-full mt-2';
                const currentWeight = weightsMap[matId];
                if (currentWeight !== undefined && currentWeight !== null && currentWeight !== '') {
                    const num = Number(currentWeight);
                    input.value = Number.isFinite(num) ? num.toFixed(2) : String(currentWeight);
                } else {
                    input.value = '';
                }
                inputsMap[matId] = input;
                input.addEventListener('input', () => {
                    const val = String(input.value).replace(',', '.');
                    const num = Number(val);
                    if (isEntrega) {
                        matWeightsEntrega[matId] = Number.isFinite(num) ? num : 0;
                    } else {
                        matWeightsRecibido[matId] = Number.isFinite(num) ? num : 0;
                    }
                    updateTotalesDesdeMateriales();
                });

                // Botones de fotos por material
                const rowBtns = document.createElement('div');
                rowBtns.className = 'flex items-center gap-2 mt-2';
                const camBtn = document.createElement('button');
                camBtn.type = 'button';
                camBtn.className = 'camera-icon';
                camBtn.title = `Tomar foto (${mat.nombre})`;
                const upBtn = document.createElement('button');
                upBtn.type = 'button';
                upBtn.className = 'upload-icon';
                upBtn.title = `Subir foto (${mat.nombre})`;
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = 'image/*';
                fileInput.multiple = true;
                fileInput.id = `material_file_${matId}`;
                fileInput.className = 'hidden';
                const preview = document.createElement('div');
                preview.id = `preview_mat_${matId}`;
                preview.className = 'mt-2 grid grid-cols-3 gap-2';

                camBtn.addEventListener('click', () => { fileInput.setAttribute('capture','environment'); fileInput.click(); });
                upBtn.addEventListener('click', () => { fileInput.removeAttribute('capture'); fileInput.click(); });
                fileInput.addEventListener('change', () => {
                    const store = isEntrega ? (matFilesEntrega[matId] ||= []) : (matFilesRecibido[matId] ||= []);
                    if (fileInput.files && fileInput.files.length > 0) {
                        Array.from(fileInput.files).forEach(f => store.push(f));
                    }
                    const existing = existingFotosMap[matId] || [];
                    renderMaterialPreview(preview, existing, store);
                    fileInput.value = '';
                });

                rowBtns.appendChild(camBtn);
                rowBtns.appendChild(upBtn);
                rowBtns.appendChild(fileInput);

                card.appendChild(label);
                card.appendChild(input);
                card.appendChild(rowBtns);
                const existing = existingFotosMap[matId] || [];
                const store = isEntrega ? (matFilesEntrega[matId] ||= []) : (matFilesRecibido[matId] ||= []);
                renderMaterialPreview(preview, existing, store);
                card.appendChild(preview);
                grid.appendChild(card);
            });

            container.appendChild(grid);
        }

        function renderMaterialPreview(container, existingPhotos, files) {
            container.innerHTML = '';
            const base = (typeof window !== 'undefined' && window.BASE_URL) ? window.BASE_URL : '/';
            const buildUrl = (path) => {
                if (!path) return '';
                const trimmed = base.replace(/\/$/, '');
                const normalized = path.startsWith('/') ? path : ('/' + path);
                return trimmed + normalized;
            };

            (existingPhotos || []).forEach((path) => {
                const wrap = document.createElement('div');
                wrap.className = 'relative';
                const img = document.createElement('img');
                img.src = buildUrl(path);
                img.className = 'w-full h-20 object-cover rounded border';
                wrap.appendChild(img);
                container.appendChild(wrap);
            });

            (files || []).forEach((file, idx) => {
                const wrap = document.createElement('div');
                wrap.className = 'relative';
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.className = 'w-full h-20 object-cover rounded border';
                img.onload = () => URL.revokeObjectURL(img.src);
                const rm = document.createElement('button');
                rm.type = 'button';
                rm.className = 'absolute top-0 right-0 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs';
                rm.innerHTML = '&times;';
                rm.onclick = (e) => { e.stopPropagation(); files.splice(idx,1); renderMaterialPreview(container, existingPhotos, files); };
                wrap.appendChild(img); wrap.appendChild(rm); container.appendChild(wrap);
            });
        }

        function updateTotalesDesdeMateriales() {
            const isEntrega = radioEntrega.checked;
            const weights = isEntrega ? matWeightsEntrega : matWeightsRecibido;
            let sum = 0;
            Object.keys(weights).forEach(k => { const v = Number(weights[k]||0); if (Number.isFinite(v)) sum += v; });
            sum = Math.round(sum*100)/100;
            pesoGrInput.value = String(sum.toFixed(2));
            const hasAny = Object.values(weights).some(v => Number(v||0) > 0);
            if (typeof updatePesoHintAndReadonly === 'function') updatePesoHintAndReadonly(hasAny);
            if (!isEntrega) {
                // actualizar merma visible
                calcularMermaDesdeSumatoria(sum);
            }
        }

        function calcularMermaDesdeSumatoria(pesoRecibidoCalc) {
            // Respetar procesos auto-completados (1,2,3,4) con merma NULL
            const pId = parseInt(procesoIdRecibidoHidden.value || '0', 10);
            if ([1, 2, 3, 4].includes(pId)) {
                mermaGrInput.value = 'NULL';
                return;
            }
            const valEnt = normalizarNumero(pesoEntregadoOriginalInput.value);
            const rec = Number(pesoRecibidoCalc);
            if (Number.isFinite(valEnt) && Number.isFinite(rec)) {
                const merma = valEnt - rec;
                mermaGrInput.value = formatDecimalComma(merma, 2);
            } else {
                mermaGrInput.value = '0,00';
            }
        }

        function hasAnyMaterialWeight() {
            const weights = radioEntrega.checked ? matWeightsEntrega : matWeightsRecibido;
            return Object.values(weights).some(v => Number(v||0) > 0);
        }

        function updatePesoHintAndReadonly(hasAny) {
            if (hasAny) {
                pesoGrInput.readOnly = true;
                if (pesoHintEl) {
                    pesoHintEl.textContent = 'Total calculado automáticamente por materiales.';
                    pesoHintEl.style.display = '';
                }
            } else {
                pesoGrInput.readOnly = false;
                if (pesoHintEl) {
                    pesoHintEl.textContent = '';
                    pesoHintEl.style.display = 'none';
                }
            }
        }

        async function buscarConsecutivo() {
            const consecutivo = buscarConsecutivoInput.value.trim();
            if (!consecutivo) {
                showMessageModal('Búsqueda', 'Ingrese un número de consecutivo válido.', 'info');
                return;
            }
            btnBuscarConsecutivo.disabled = true;
            btnBuscarConsecutivo.textContent = 'Buscando...';
            trazabilidadInfo.classList.add('hidden');
            entregaDataRecibido.classList.add('hidden');
            submitButton.disabled = true;
            registroIdRecibidoInput.value = '';
            const result = await callApi(`${API_TRAZABILIDAD}/${consecutivo}`, 'GET');
            btnBuscarConsecutivo.disabled = false;
            btnBuscarConsecutivo.textContent = 'Buscar';
            consecutivoDisplay.textContent = consecutivo.padStart(4, '0');
            consecutivoInput.value = consecutivo;
            if (result.success) {
                const data = result.data;
                entregaDataRecibido.classList.remove('hidden');
                displayPesoEntregado.textContent = formatDecimalComma(data.peso_entregado_gr, 2);
                displayFechaEntrega.textContent = data.fecha_entrega ? data.fecha_entrega : 'N/A';
                let obsEntregaPure = (data.obs_entrega_pura || '').trim();
                if (!obsEntregaPure) {
                    const rawObs = (data.observaciones_entrega || '').trim();
                    if (rawObs) {
                        const firstEntrega = rawObs.split(/\r?\n/).find(l => !/^\s*RECIBIDO:/i.test(l));
                        obsEntregaPure = firstEntrega ? firstEntrega.replace(/^\s*ENTREGA:\s*/i, '').trim() : '';
                    }
                }
                const obsRecibido = (data.obs_recibido_pura || '').trim();
                displayObservacionesEntrega.textContent = `Entrega: ${obsEntregaPure || 'Sin observaciones'}${obsRecibido ? ' | Recibido: ' + obsRecibido : ''}`;
                document.getElementById('observaciones').value = '';
                procesoNombreRecibido.value = data.proceso_nombre;
                responsableNombreRecibido.value = data.responsable_nombre;
                productoNombreRecibido.value = data.producto_nombre;
                procesoIdRecibidoHidden.value = data.proceso_id;
                pesoEntregadoOriginalInput.value = data.peso_entregado_gr;
                registroIdRecibidoInput.value = data.id;
                submitButton.disabled = false;
                // Al cargar datos de recibido, bloquear el peso si hay materiales en uso
                updatePesoHintAndReadonly(hasAnyMaterialWeight());
                pesoGrInput.focus();
                const pId = parseInt(data.proceso_id, 10);
                mermaGrInput.value = ([1, 2, 3, 4].includes(pId)) ? 'NULL' : '0,00';

                // Cargar materiales asociados para prellenar en RECIBIDO
                try {
                    const mats = await callApi(`trazabilidad/materiales/${consecutivo}`, 'GET');
                    if (mats.success && mats.data) {
                        const entregaList = mats.data.entrega || [];
                        const recibidoList = mats.data.recibido || [];
                        const prefList = (recibidoList.length > 0) ? recibidoList : entregaList;
                        // reset de archivos nuevos y estado previo
                        matFilesRecibido = {};
                        setMaterialesStateFromDB('recibido', prefList);
                        renderMaterialesUI('recibido');
                        updateTotalesDesdeMateriales();
                    }
                } catch (e) {
                    console.warn('No se pudieron cargar materiales del consecutivo:', e);
                }
            } else {
                trazabilidadInfo.textContent = result.message || 'Error desconocido en la búsqueda.';
                trazabilidadInfo.classList.remove('hidden');
                procesoNombreRecibido.value = '';
                responsableNombreRecibido.value = '';
                productoNombreRecibido.value = '';
                pesoEntregadoOriginalInput.value = '';
                mermaGrInput.value = '0,00';
                procesoIdRecibidoHidden.value = '';
            }
        }

        // --- CORRECCIÓN CLAVE ---
        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const isEntrega = radioEntrega.checked;
            const endpoint = isEntrega ? `${API_TRAZABILIDAD}/entrega` : `${API_TRAZABILIDAD}/recibido`;
            const action = isEntrega ? 'Entrega' : 'Recibido';
            const fileStore = isEntrega ? fileStoreEntrega : fileStoreRecibido;
            const fotoInputName = isEntrega ? 'foto_entrega[]' : 'foto_recibido[]';

            if (fileStore.length === 0) {
                showMessageModal('Error de Validación', 'Debe subir al menos una foto.', 'error');
                return;
            }

            if (!isEntrega) {
                if (!registroIdRecibidoInput.value || !pesoGrInput.value.trim() || !pesoEntregadoOriginalInput.value) {
                    showMessageModal('Error de Validación', 'Faltan datos para el registro de recibido. Busque el consecutivo nuevamente.', 'error');
                    return;
                }
            }

            submitButton.disabled = true;
            const originalText = submitButton.textContent;
            submitButton.textContent = `Registrando ${action}...`;

            // --- Construcción Manual del FormData ---
            const formData = new FormData();

            // 1. Añadir todos los campos del formulario EXCEPTO los de tipo 'file'
            const formElements = form.elements;
            for (let i = 0; i < formElements.length; i++) {
                const element = formElements[i];
                if (!element.name || element.type === 'submit' || element.type === 'button' || element.type === 'file' || (element.type === 'radio' && !element.checked)) {
                    continue;
                }
                let valueToAppend = element.value;
                if ((element.name === 'peso_gr' || element.name === 'merma_gr') && valueToAppend !== 'NULL') {
                    valueToAppend = String(valueToAppend).replace(',', '.');
                }
                formData.append(element.name, valueToAppend);
            }

            // 2. Añadir los archivos desde el almacén de JavaScript (globales)
            fileStore.forEach((file) => {
                formData.append(fotoInputName, file, file.name);
            });

            // 3. Adjuntar detalle de materiales (pesos y fotos)
            const modo = isEntrega ? 'entrega' : 'recibido';
            const weights = isEntrega ? matWeightsEntrega : matWeightsRecibido;
            const filesMap = isEntrega ? matFilesEntrega : matFilesRecibido;
            const materialesPayload = [];
            materialesCatalog.forEach(mat => {
                const id = mat.id; const peso = Number(weights[id]||0);
                if (Number.isFinite(peso) && peso > 0) {
                    materialesPayload.push({ material_id: id, peso: Number(peso.toFixed(2)) });
                }
            });
            if (materialesPayload.length > 0) {
                formData.append('materiales_json', JSON.stringify(materialesPayload));
            }
            Object.keys(filesMap).forEach(id => {
                const arr = filesMap[id]||[];
                arr.forEach(f => formData.append(`material_fotos_${id}[]`, f, f.name));
            });
            // --- Fin de la Construcción Manual ---

            try {
                const base = (typeof window !== 'undefined' && window.BASE_URL) ? window.BASE_URL : '/';
                const apiUrl = base.replace(/\/$/, '') + `/api/${endpoint}`;
                const response = await fetch(apiUrl, { method: 'POST', body: formData });
                const result = await response.json();

                if (result.success) {
                    if (isEntrega) {
                        showMessageModal('Éxito', result.message, 'success');
                        setFormMode('entrega');
                    } else {
                        const consec = (consecutivoInput.value || '').toString().padStart(4, '0');
                        window.location.href = base.replace(/\/$/, '') + '/trazabilidad_list?highlight=' + encodeURIComponent(consec);
                        return;
                    }
                } else {
                    showMessageModal('Error de Registro', result.message || `Error desconocido al registrar ${action}.`, 'error');
                }
            } catch (error) {
                console.error('Error de red/servidor:', error);
                showMessageModal('Error de Conexión', `No se pudo conectar al servidor para registrar ${action}.`, 'error');
            } finally {
                submitButton.textContent = originalText;
                if (isEntrega) {
                    submitButton.disabled = false;
                }
            }
        });

        // --- EVENT LISTENERS ---
        document.querySelectorAll('input[name="tipo_movimiento"]').forEach(radio => {
            radio.addEventListener('change', (e) => setFormMode(e.target.value));
        });
        btnBuscarConsecutivo.addEventListener('click', buscarConsecutivo);
        buscarConsecutivoInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                buscarConsecutivo();
            }
        });

        function normalizarNumero(valor) {
            if (typeof valor === 'number') return valor;
            if (valor === null || valor === undefined) return NaN;
            const s = String(valor).replace(/\s+/g, '').replace(',', '.');
            if (s === '') return NaN;
            const n = Number(s);
            return Number.isFinite(n) ? n : NaN;
        }

        // Formatea número con coma como separador decimal (visible)
        function formatDecimalComma(val, dec = 2) {
            const num = Number(val);
            if (!Number.isFinite(num)) return '';
            return num.toLocaleString('es-CO', { minimumFractionDigits: dec, maximumFractionDigits: dec });
        }

        function calcularMermaEnVivo() {
            if (!radioRecibido.checked) return;
            const pId = parseInt(procesoIdRecibidoHidden.value || '0', 10);
            if ([1, 2, 3, 4].includes(pId)) {
                mermaGrInput.value = 'NULL';
                return;
            }
            let pesoRecibido = normalizarNumero(pesoGrInput.value);
            const pesoOriginal = normalizarNumero(pesoEntregadoOriginalInput.value);
            if (Number.isFinite(pesoOriginal) && Number.isFinite(pesoRecibido)) {
                const merma = pesoOriginal - pesoRecibido;
                mermaGrInput.value = formatDecimalComma(merma, 2);
            } else {
                mermaGrInput.value = '0,00';
            }
        }
        pesoGrInput.addEventListener('input', calcularMermaEnVivo);

        function setupPhotoButtons(cameraBtnId, uploadBtnId, fileInputId) {
            const cameraBtn = document.getElementById(cameraBtnId);
            const uploadBtn = document.getElementById(uploadBtnId);
            const fileInput = document.getElementById(fileInputId);
            cameraBtn.addEventListener('click', () => {
                fileInput.setAttribute('capture', 'environment');
                fileInput.click();
            });
            uploadBtn.addEventListener('click', () => {
                fileInput.removeAttribute('capture');
                fileInput.click();
            });
            fileInput.addEventListener('change', () => {
                updateAndPreviewImages(fileInput);
            });
        }

        // --- INICIALIZACIÓN ---
        window.onload = function () {
            loadDropdown(API_PROCESOS, 'proceso_id', 'Seleccionar Proceso');
            loadDropdown(API_RESPONSABLES, 'responsable_id', 'Seleccionar Responsable');
            loadDropdown(API_PRODUCTOS, 'producto_id', 'Seleccionar Producto');
            setupPhotoButtons('btn-camera-entrega', 'btn-upload-entrega', 'foto_entrega');
            setupPhotoButtons('btn-camera-recibido', 'btn-upload-recibido', 'foto_recibido');
            // Cargar materiales antes de construir la UI
            loadMateriales().then(() => setFormMode('entrega'));
            document.getElementById('logout-btn').addEventListener('click', async function (e) {
                e.preventDefault();
                const result = await callApi('logout', 'GET');
                if (result.success) {
                    const base = (typeof window !== 'undefined' && window.BASE_URL) ? window.BASE_URL : '/';
                    window.location.href = base;
                } else {
                    showMessageModal('Error', 'No se pudo cerrar sesión.', 'error');
                }
            });
            try {
                const params = new URLSearchParams(window.location.search);
                const mode = (params.get('mode') || '').toLowerCase();
                const consecParam = params.get('consecutivo');
                if (mode === 'recibido' && consecParam) {
                    setFormMode('recibido');
                    const consecClean = String(consecParam).replace(/\D+/g, '');
                    if (consecClean) {
                        buscarConsecutivoInput.value = consecClean;
                        setTimeout(() => buscarConsecutivo(), 100);
                    }
                }
            } catch (e) {
                console.warn('No se pudieron leer los parámetros de la URL:', e);
            }
        };
    </script>
</body>
